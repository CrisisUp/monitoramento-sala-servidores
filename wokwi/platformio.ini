[env:esp32dev]
platform  = espressif32@6.13.0
board     = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson@7.4.3
    adafruit/DHT sensor library@1.4.7
    adafruit/Adafruit Unified Sensor@1.1.15

board_build.partitions = min_spiffs.csv

build_flags =
    -DCORE_DEBUG_LEVEL=1
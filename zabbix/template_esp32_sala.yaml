zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 72f5c20715694c948d86c0f4fc94c099
      name: 'Templates/Sala do servidor'
  templates:
    - uuid: da1af82df1a149fb97e0bb287860cec2
      template: 'ESP32 Sala do Servidor'
      name: 'ESP32 Sala do Servidor'
      description: 'Ambiente físico da sala do servidor via ESP32 (http://IP/status). Gerado por zabbix/configurar.py.'
      groups:
        - name: 'Templates/Sala do servidor'
      items:
        - uuid: 01b2592b094f4231bbf9d5878053da5e
          name: Vazamento
          type: DEPENDENT
          key: esp32.agua
          delay: '0'
          valuemap:
            name: Agua
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.agua
              error_handler: DISCARD_VALUE
          master_item:
            key: esp32.status
          tags:
            - tag: sensor
              value: agua
          triggers:
            - uuid: 5a1023f3d6cf40cf95c3a7ac51942aa2
              expression: 'last(/ESP32 Sala do Servidor/esp32.agua)=1'
              name: 'Água detectada no piso'
              priority: DISASTER
              description: 'O sensor de chuva do piso está molhado. Possível goteira do ar-condicionado.'
              tags:
                - tag: efeito
                  value: agua
                - tag: local
                  value: sala-servidor
        - uuid: cf468d7f92484348ae55afab58e3f01d
          name: 'Água: leitura bruta'
          type: DEPENDENT
          key: esp32.agua_raw
          delay: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.agua_raw
              error_handler: DISCARD_VALUE
          master_item:
            key: esp32.status
          tags:
            - tag: sensor
              value: calibracao
        - uuid: 9dbff6baa9c943579a98524a17a9e133
          name: 'Sensor DHT11'
          type: DEPENDENT
          key: esp32.dht_ok
          delay: '0'
          valuemap:
            name: DHT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.dht_ok
              error_handler: DISCARD_VALUE
            - type: BOOL_TO_DECIMAL
              parameters:
                - ''
          master_item:
            key: esp32.status
          tags:
            - tag: sensor
              value: temperatura
          triggers:
            - uuid: 944f38a0edda4e5a9d4a4fe15fc2886f
              expression: 'max(/ESP32 Sala do Servidor/esp32.dht_ok,1m)=0'
              name: 'Sensor DHT11 sem resposta'
              priority: INFO
              description: 'O DHT11 falhou em todas as leituras do último minuto. Confira o fio DATA (GPIO 4).'
              tags:
                - tag: efeito
                  value: dht
                - tag: local
                  value: sala-servidor
        - uuid: 9a33711fffe445f798525eae8a4cf138
          name: 'Energia da tomada'
          type: DEPENDENT
          key: esp32.energia
          delay: '0'
          valuemap:
            name: Energia
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.energia
              error_handler: DISCARD_VALUE
          master_item:
            key: esp32.status
          tags:
            - tag: sensor
              value: energia
          triggers:
            - uuid: e3b9d5e7552f455682afe2758913575f
              expression: 'last(/ESP32 Sala do Servidor/esp32.energia)=0'
              name: 'Tomada sem energia'
              priority: HIGH
              description: 'O carregador-sentinela parou de dar 5 V: a tomada (filtro de linha) caiu. O servidor pode estar só na bateria/nobreak.'
              tags:
                - tag: efeito
                  value: energia
                - tag: local
                  value: sala-servidor
        - uuid: 9374b22f140b4bb991845b45e864771f
          name: 'Energia: sensor instalado (1=sim)'
          type: DEPENDENT
          key: esp32.energia_instalada
          delay: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.energia_instalada
              error_handler: DISCARD_VALUE
          master_item:
            key: esp32.status
          tags:
            - tag: sensor
              value: calibracao
        - uuid: db0b8f61932f4d27bd49331f0447d208
          name: 'Energia: leitura bruta'
          type: DEPENDENT
          key: esp32.energia_raw
          delay: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.energia_raw
              error_handler: DISCARD_VALUE
          master_item:
            key: esp32.status
          tags:
            - tag: sensor
              value: calibracao
        - uuid: 33fecd6192c9401fb4ae4f486a89c624
          name: 'Porta da sala'
          type: DEPENDENT
          key: esp32.porta
          delay: '0'
          valuemap:
            name: Porta
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.porta_aberta
              error_handler: DISCARD_VALUE
          master_item:
            key: esp32.status
          tags:
            - tag: sensor
              value: porta
          triggers:
            - uuid: 217794315be445f4946110714a108acd
              expression: 'min(/ESP32 Sala do Servidor/esp32.porta,{$PORTA.TEMPO})=1'
              name: 'Porta aberta há mais de {$PORTA.TEMPO}'
              priority: WARNING
              description: 'A porta ficou aberta durante todo o período.'
              tags:
                - tag: efeito
                  value: porta
                - tag: local
                  value: sala-servidor
        - uuid: 0804a5bf72b943b0a8c17349f98d371d
          name: 'Porta: pino cru (1=HIGH, 0=LOW)'
          type: DEPENDENT
          key: esp32.porta_raw
          delay: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.porta_raw
              error_handler: DISCARD_VALUE
          master_item:
            key: esp32.status
          tags:
            - tag: sensor
              value: calibracao
        - uuid: 776ae2bf78854ed28197c183263cf7a3
          name: 'ESP32: sinal Wi-Fi'
          type: DEPENDENT
          key: esp32.rssi
          delay: '0'
          value_type: FLOAT
          units: dBm
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.wifi_rssi
              error_handler: DISCARD_VALUE
          master_item:
            key: esp32.status
          tags:
            - tag: sensor
              value: esp32
        - uuid: d9be45777dd54126b4f32608e0a5e647
          name: 'ESP32 status (JSON)'
          type: HTTP_AGENT
          key: esp32.status
          delay: '{$ESP32.INTERVALO}'
          history: 1d
          value_type: TEXT
          trends: '0'
          allow_traps: 'YES'
          description: 'JSON do ESP32: buscado a cada {$ESP32.INTERVALO} (polling) e também recebido na hora quando algo muda (push). Os itens dependentes recortam cada campo.'
          timeout: 5s
          url: 'http://{$ESP32.IP}/status'
          tags:
            - tag: componente
              value: esp32
          triggers:
            - uuid: d4a366bed32f4f349957d5513ac718c4
              expression: 'nodata(/ESP32 Sala do Servidor/esp32.status,{$ESP32.SEM_DADOS})=1'
              name: 'ESP32 parou de responder'
              priority: HIGH
              description: 'O Zabbix não recebe o /status do ESP32. Placa desligada, fora do Wi-Fi ou IP mudou.'
              tags:
                - tag: efeito
                  value: sensor
                - tag: local
                  value: sala-servidor
        - uuid: 0d6f36e4483d4426baacae25bec85f45
          name: 'Temperatura da sala'
          type: DEPENDENT
          key: esp32.temperatura
          delay: '0'
          value_type: FLOAT
          units: °C
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.temperatura
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: esp32.status
          tags:
            - tag: sensor
              value: temperatura
          triggers:
            - uuid: a7cfcd9210374ba0b60d10b9dab8c982
              expression: 'avg(/ESP32 Sala do Servidor/esp32.temperatura,2m)>{$TEMP.ALTA}'
              name: 'Temperatura da sala acima de {$TEMP.ALTA} °C'
              priority: HIGH
              description: 'Média dos últimos 2 minutos acima do limite alto. Verifique o ar-condicionado.'
              tags:
                - tag: efeito
                  value: temperatura
                - tag: local
                  value: sala-servidor
            - uuid: 4fee4b136afd47909cd098e873e7c762
              expression: 'avg(/ESP32 Sala do Servidor/esp32.temperatura,2m)>{$TEMP.ATENCAO}'
              name: 'Temperatura da sala acima de {$TEMP.ATENCAO} °C'
              priority: WARNING
              description: 'Média dos últimos 2 minutos acima do limite de atenção.'
              dependencies:
                - name: 'Temperatura da sala acima de {$TEMP.ALTA} °C'
                  expression: 'avg(/ESP32 Sala do Servidor/esp32.temperatura,2m)>{$TEMP.ALTA}'
              tags:
                - tag: efeito
                  value: temperatura
                - tag: local
                  value: sala-servidor
        - uuid: 598b7019aeb743308ebd1cdce59100f0
          name: 'Umidade da sala'
          type: DEPENDENT
          key: esp32.umidade
          delay: '0'
          units: '%'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.umidade
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - '^-?[0-9]+(\.[0-9]+)?$'
              error_handler: DISCARD_VALUE
          master_item:
            key: esp32.status
          tags:
            - tag: sensor
              value: umidade
        - uuid: f3c19070942740f897882709f5ee7f43
          name: 'ESP32: tempo ligado'
          type: DEPENDENT
          key: esp32.uptime
          delay: '0'
          units: uptime
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.uptime_s
              error_handler: DISCARD_VALUE
          master_item:
            key: esp32.status
          tags:
            - tag: sensor
              value: esp32
        - uuid: c2db0f3622e24b39a049f96a154c91ca
          name: 'ESP32: versão do firmware'
          type: DEPENDENT
          key: esp32.versao
          delay: '0'
          value_type: CHAR
          trends: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.versao
              error_handler: DISCARD_VALUE
          master_item:
            key: esp32.status
          tags:
            - tag: sensor
              value: esp32
      tags:
        - tag: local
          value: sala-servidor
      macros:
        - macro: '{$ESP32.INTERVALO}'
          value: 15s
          description: 'De quanto em quanto tempo o Zabbix BUSCA o /status (polling). Serve para a temperatura/umidade e como sinal de vida. Água, porta e energia não esperam por isso: o ESP32 EMPURRA o JSON na hora em que mudam (push, porta 10051).'
        - macro: '{$ESP32.IP}'
          value: 192.168.0.50
          description: 'IP (ou nome) do ESP32. O host esp32-sala sobrescreve com o valor do .env.'
        - macro: '{$ESP32.SEM_DADOS}'
          value: 2m
          description: 'Tempo sem resposta até alertar ''ESP32 parou de responder''.'
        - macro: '{$PORTA.TEMPO}'
          value: 1m
          description: 'Porta aberta por mais que isso vira alerta.'
        - macro: '{$TEMP.ALTA}'
          value: '32'
          description: '°C: alerta de severidade Alta.'
        - macro: '{$TEMP.ATENCAO}'
          value: '28'
          description: '°C: alerta de Atenção.'
      valuemaps:
        - uuid: 1c79b1b0457944e18949ec9c1fc1b847
          name: Agua
          mappings:
            - value: '0'
              newvalue: Seco
            - value: '1'
              newvalue: 'Água detectada'
        - uuid: 6f73261f52654c27b0de056c4bba206c
          name: DHT
          mappings:
            - value: '0'
              newvalue: Falha
            - value: '1'
              newvalue: OK
        - uuid: d0159b90212e40beae9bf9a9e5cfd8d7
          name: Energia
          mappings:
            - value: '0'
              newvalue: 'Sem energia'
            - value: '1'
              newvalue: 'Com energia'
        - uuid: 79f68735c4614de78106d8624bb8af17
          name: Porta
          mappings:
            - value: '0'
              newvalue: Fechada
            - value: '1'
              newvalue: Aberta
